name: fetch-market-data
on:
  schedule:
    - cron: "7 6-21 * * 1-5"   # hourly, weekdays, 06:07-21:07 UTC
    - cron: "17 12 * * 0,6"    # once a day on weekends (crypto)
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra tickers, space separated"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py ${{ github.event.inputs.extra }}
      - name: Commit data
        run: |
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%FT%TZ)"
          git push
